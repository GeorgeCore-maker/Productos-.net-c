name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    env:
      Jwt__Key: "ci-secret-key-long-enough-for-hmac-sha256-0123456789abcdef"
      Jwt__Issuer: "MiPrimeraApi"
      Jwt__Audience: "MiPrimeraApiClient"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore MiPrimeraApi.csproj

      - name: Compilar
        run: dotnet build MiPrimeraApi.csproj --configuration Release --no-restore

      - name: Prueba de arranque (smoke test)
        run: |
          ASPNETCORE_URLS=http://localhost:5283 \
            dotnet run --project MiPrimeraApi.csproj --configuration Release --no-build --no-launch-profile &
          APP_PID=$!

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5283/; then
              break
            fi
            sleep 1
          done

          echo "Respuesta de la API:"
          curl -sf http://localhost:5283/

          kill "$APP_PID"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
